$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineDeployment.schema.json
name: green
endpoint_name: meridian-eta-endpoint
model: azureml:meridian-eta-predictor:2
instance_type: Standard_DS3_v2
instance_count: 1
egress_public_network_access: enabled
request_settings:
  request_timeout_ms: 60000
  max_concurrent_requests_per_instance: 10
  max_queue_wait_ms: 500
liveness_probe:
  initial_delay: 30
  period: 30
  timeout: 2
  failure_threshold: 3
readiness_probe:
  initial_delay: 30
  period: 30
  timeout: 2
  failure_threshold: 3
