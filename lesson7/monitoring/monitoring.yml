$schema: https://azuremlschemas.azureedge.net/latest/monitorSchedule.schema.json
name: meridian-eta-drift-monitor
display_name: Meridian ETA predictor — driver GPS drift monitor
description: >
  Watches the inbound driver-GPS feature distribution against the captured baseline
  and flags data drift when the aggregated signal exceeds 0.3. Baseline captured from
  a representative week of production traffic prior to blue/green rollout.

trigger:
  type: recurrence
  frequency: day
  interval: 1
  schedule:
    hours: [3]
    minutes: [0]

create_monitor:
  compute:
    instance_type: standard_e4s_v3
    runtime_version: "3.3"

  monitoring_target:
    endpoint_deployment_id: azureml:meridian-eta-endpoint:blue
    ml_task: regression

  monitoring_signals:
    driver_gps_data_drift:
      type: data_drift
      production_data:
        input_data:
          path: azureml:meridian-eta-endpoint-blue-collect:1
          type: uri_folder
        data_context: model_inputs
        data_window:
          lookback_window_size: P7D
          lookback_window_offset: P0D
      reference_data:
        input_data:
          path: azureml:driver-gps-baseline:1
          type: uri_folder
        data_context: model_inputs
      features:
        top_n_feature_importance: 10
      metric_thresholds:
        numerical:
          jensen_shannon_distance: 0.3
        categorical:
          jensen_shannon_distance: 0.3
      alert_enabled: true

  alert_notification:
    emails:
      - meridian-mlops@example.com
