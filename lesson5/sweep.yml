$schema: https://azuremlschemas.azureedge.net/latest/sweepJob.schema.json
type: sweep

display_name: meridian-eta-sweep
experiment_name: meridian-eta-predictor

sampling_algorithm: random

trial:
  code: .
  command: >-
    python train.py
    --driver_logs ${{inputs.driver_logs}}
    --max_depth ${{search_space.max_depth}}
    --learning_rate ${{search_space.learning_rate}}
    --n_estimators ${{search_space.n_estimators}}
  environment: azureml:eta-training-env:1

search_space:
  max_depth:
    type: choice
    values: [3, 4, 5, 6, 7, 8, 9, 10]
  learning_rate:
    type: uniform
    min_value: 0.01
    max_value: 0.3
  n_estimators:
    type: choice
    values: [100, 200, 300, 400, 500]

objective:
  primary_metric: test_rmse
  goal: minimize

limits:
  max_total_trials: 20
  max_concurrent_trials: 4
  timeout: 3600

early_termination:
  type: median_stopping
  evaluation_interval: 1
  delay_evaluation: 5

inputs:
  driver_logs:
    type: uri_file
    path: azureml:driver-gps-logs:1
    mode: ro_mount

compute: azureml:cpu-cluster
