name: Retrain ETA predictor on drift

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for retrain (drift alert id, manual, scheduled sweep, etc.)
        required: false
        default: manual
      resource_group:
        description: Azure resource group for the ML workspace
        required: true
      workspace_name:
        description: Azure ML workspace name
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  submit-retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install az ml extension
        run: az extension add -n ml -y

      - name: Submit retrain job
        run: |
          echo "Retrain reason: ${{ github.event.inputs.reason }}"
          az ml job create \
            -f lesson7/training/train-eta-job.yml \
            --resource-group "${{ github.event.inputs.resource_group }}" \
            --workspace-name "${{ github.event.inputs.workspace_name }}"
