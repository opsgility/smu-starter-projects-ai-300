name: Deploy Meridian MLOps workspace

on:
  push:
    branches:
      - main
    paths:
      - 'project/main.bicep'
      - '.github/workflows/deploy-workspace.yml'
  workflow_dispatch:

# Required for OIDC federation: id-token: write lets the runner mint the
# short-lived JWT that azure/login@v2 exchanges for an Azure access token.
permissions:
  id-token: write
  contents: read

env:
  # These come from repository secrets and the lab environment; the workflow
  # rejects them if any are missing (see the validate step below).
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'meridian-mlops-rg' }}
  WORKSPACE_NAME_SUFFIX: ${{ vars.WORKSPACE_NAME_SUFFIX || 'demo' }}
  STORAGE_ACCOUNT_NAME: ${{ vars.STORAGE_ACCOUNT_NAME || 'meridianmlopsstor' }}
  KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME || 'meridian-mlops-kv' }}
  CONTAINER_REGISTRY_NAME: ${{ vars.CONTAINER_REGISTRY_NAME || 'meridianmlopsacr' }}
  APP_INSIGHTS_NAME: ${{ vars.APP_INSIGHTS_NAME || 'meridian-mlops-ai' }}

jobs:
  deploy:
    name: Deploy workspace via Bicep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          missing=""
          [ -z "${{ secrets.AZURE_CLIENT_ID }}" ] && missing="$missing AZURE_CLIENT_ID"
          [ -z "${{ secrets.AZURE_TENANT_ID }}" ] && missing="$missing AZURE_TENANT_ID"
          [ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ] && missing="$missing AZURE_SUBSCRIPTION_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing required repository secrets:$missing"
            echo "Set them at Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "All required secrets are present."

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Show target context
        run: |
          echo "Resource group : $AZURE_RESOURCE_GROUP"
          echo "Workspace name : meridian-mlws-$WORKSPACE_NAME_SUFFIX"
          az account show --output table

      - name: What-if (preview changes)
        run: |
          az deployment group what-if \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file project/main.bicep \
            --parameters \
              workspaceNameSuffix="$WORKSPACE_NAME_SUFFIX" \
              storageAccountName="$STORAGE_ACCOUNT_NAME" \
              keyVaultName="$KEY_VAULT_NAME" \
              containerRegistryName="$CONTAINER_REGISTRY_NAME" \
              applicationInsightsName="$APP_INSIGHTS_NAME"

      - name: Deploy workspace
        run: |
          az deployment group create \
            --name "deploy-workspace-${{ github.run_id }}" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file project/main.bicep \
            --parameters \
              workspaceNameSuffix="$WORKSPACE_NAME_SUFFIX" \
              storageAccountName="$STORAGE_ACCOUNT_NAME" \
              keyVaultName="$KEY_VAULT_NAME" \
              containerRegistryName="$CONTAINER_REGISTRY_NAME" \
              applicationInsightsName="$APP_INSIGHTS_NAME" \
            --output table

      - name: Verify workspace
        run: |
          az ml workspace show \
            --name "meridian-mlws-$WORKSPACE_NAME_SUFFIX" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --output table || \
          az resource show \
            --resource-type Microsoft.MachineLearningServices/workspaces \
            --name "meridian-mlws-$WORKSPACE_NAME_SUFFIX" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --output table
